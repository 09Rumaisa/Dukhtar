# Render deployment configuration
# This file tells Render how to deploy your app

services:
  # Web service (Flask app)
  - type: web
    name: dukhtar-app
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app -c gunicorn_config.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: dukhtar-db
          property: connectionString
      - key: FLASK_ENV
        value: production
      # IMPORTANT: Add these in Render Dashboard -> Environment
      # - OPENAI_API_KEY (required for AI features)
      # - TAVILY_API_KEY (required for pregnancy guide search)
      # - LANGSMITH_API_KEY (optional for monitoring)
      # - AWS_ACCESS_KEY_ID (required for file storage)
      # - AWS_SECRET_ACCESS_KEY (required for file storage)
      # - AWS_REGION (e.g., us-east-1)
      # - AWS_S3_IMAGES_BUCKET (your bucket name)
      # - AWS_S3_AUDIO_BUCKET (your bucket name)
      # - FLASK_SECRET_KEY (generate with: python -c "import secrets; print(secrets.token_hex(32))")

databases:
  # PostgreSQL database
  - name: dukhtar-db
    databaseName: dukhtar
    user: dukhtar_user
