# Render deployment configuration
# This file tells Render how to deploy your app

services:
  # Web service (Flask app)
  - type: web
    name: dukhtar-app
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: dukhtar-db
          property: connectionString
      # Add your other environment variables in Render dashboard
      - key: FLASK_ENV
        value: production

databases:
  # PostgreSQL database
  - name: dukhtar-db
    databaseName: dukhtar
    user: dukhtar_user
